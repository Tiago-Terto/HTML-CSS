<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela</title>
    <style>
        h1{
            font: bold 30px Verdana;
            text-align: center;
        }
        table{
            border-collapse: collapse;
            margin: auto;
            width: 600px;
        }
        th, td.forte{
            font-weight: bold; /* Corrigido de font-size: bold */
            color: white;
            background-color: rgb(105, 105, 105);
        }
        td, th{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            border: 2px solid black;
            padding: 5px 20px 5px 20px;
        }
        .mat{
            text-align: left;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Boletim Escolar</h1>
    <table>
        <thead>
            <tr>
                <th scope="rowgroup" rowspan="2">Área</th>
                <th scope="col" rowspan="2" style="width: 300px;">Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas</th>
                <th scope="col" rowspan="2" style="width: 60px;">Média</th>
            </tr>
            <tr>
                <th scope="col" style="width: 60px; font-size: 18px;">Nota 1</th>
                <th scope="col" style="width: 60px; font-size: 18px;">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" rowspan="4">Exatas</th>
                <td class="mat">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="mat">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="mat">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="mat">Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" class="mat" colspan="4">Média de Exatas</th>
                <td class="forte">0.0</td>
            </tr>

            <tr>
                <th scope="rowgroup" rowspan="2">Humanas</th>
                <td class="mat">História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="mat">Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" class="mat" colspan="4">Média de Humanas</th>
                <td class="forte">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
