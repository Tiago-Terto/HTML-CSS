<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        body {
            display: grid;
            grid-template: 1.5fr 1fr 10fr 1fr / 1fr 2fr 1fr;
            gap: 5px;

        }

        header, nav, section, aside, footer {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            background-color: rgb(255, 255, 114);
            border: 2px dashed rgba(0, 0, 255, 0.351);

        }

        header {
            grid-area: 1 / 1 / 2 / -1;
        }

        nav {
            grid-area: 2 / 1 / 3 / -1;
        }

        section {
            grid-area: 3 / 1 / 4 / -2;
        }

        aside {
            grid-area: 3 / -2 / 4 / -1;
        }

        footer {
            grid-area: 4 / 1 / 5 / -1;
        }

    </style>
</head>
<body>
    <header>
        <p>Topo</p>
    </header>
    <nav>
        <p>menu</p>
    </nav>
    <section>
        <p>principal</p>
    </section>
    <aside>
        <p>secundario</p>
    </aside>
    <footer>
        <p>rodape</p>
    </footer>
</body>
</html>
