<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>

    <style>
        /*CSS é soberano no tamanho do iframe*/
        iframe{
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de Iframe</h1>
    <p>
        Acessando o site do 
        
        <!--Tamanho padrão 300x150-->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="no">
            <a href="hhttps://www.cursoemvideo.com" target="_blank">CursoemVideo</a>
        </iframe>

        para aprender a programar
    </p>
    <p>
        O site do 

        <iframe src="https://google.com" frameborder="1" width="500">
            <a href="https://google.com" target="_blank">Google</a>
        </iframe>

        em iframe também seria muito legal se funcionasse.
    </p>
</body>
</html>
