<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesclagem de Células</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td{
            font: 20px Arial;
            border: 1px solid black;
            padding: 25px;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
</body>
    <table>
        <tr>
            <td rowspan="3">A</td>
            <td colspan="2">B</td>
 
        </tr>
        <tr>
            <td>E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>H</td>
            <td>I</td>
        </tr>
    </table>
</html>
