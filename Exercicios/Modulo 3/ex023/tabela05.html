<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            font:bold 30px Verdana;
            text-align: center;
        }
        table{
            border-collapse: collapse;
            margin: auto;
        }
        th{
            font-size: bold;
        }
        td, th{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            border: 1px solid black;
            padding: 10px 20px 10px 20px;
        }
        col.cnome{
            background-color: greenyellow;
        }

        col.cgrupo{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="2">
            <col class="cprofissao">
        </colgroup>
        <caption>Cadastro de Pessoas</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Silva</td>
                <td>F</td>
                <td>25</td>
                <td>Programadora</td>
            </tr>
            <tr>
                <td>Carlos Luz</td>
                <td>M</td>
                <td>32</td>
                <td>Designer</td>
            </tr>
            <tr>
                <td>Mariana Souza</td>
                <td>F</td>
                <td>28</td>
                <td>Engenheira</td>
            </tr>
            <tr>
                <td>Ricardo Lima</td>
                <td>M</td>
                <td>40</td>
                <td>Professor</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
