<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2em;
        }
        /*
        -- Propriedades Container --
        display: grid;
        - Virá um grid container
        grid-template-rows: 100px 100px 100px;
        grid-template-columns: auto auto auto;
            grid-template: ;

        grid-gap: 10px;

        align-items: ;
        justify-items: ;
            place-items: ;
            - Alinha os itens

        align-content: ;
        justify-content ;
            place-content: ;
            - Alinha o todos os itens no container
            
        grid-auto-row: ;
        grid-auto-column;
        grid-auto-flow: ;
        place-items: ;
        place-content: ;
        grid-template: ;

        função repeat();
            grid-template: repeat(3, 100px) / repeat(3,auto);

        Unidade fracional
            grid-template-columns: 1fr 2fr 1fr;

        
        */
        div.container {
            background-color: rgb(255, 236, 214);
            border: 3px dashed rgb(26, 255, 26);
            height: 500px;


            display: grid;
            /*
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 100px 100px 100px;
            */
            grid-template: repeat(3, 100px) / 1fr 2fr 1fr;
            gap: 5px;

            /*
            align-items: center;
            justify-items: normal;
            align-content: space-evenly;
            justify-content: space-between;
            */

        


        }

        div.item {
            border: 3px dashed rgb(32, 73, 255);
            background-color: rgb(189, 255, 255);

            text-align: center;
        
        }
        
    
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
