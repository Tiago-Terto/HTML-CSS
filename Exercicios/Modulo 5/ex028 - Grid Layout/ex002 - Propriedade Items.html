<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2em;
        }
        /*

        -- grid area --
        
        grid-row-start: ;
        grid-row-end ;
        grid-column-start: ;
        grid-column-end: ;

        span ;
        grid-row: ;
        grid-column: ;
        grid-area: ;


        */
        div.container {
            background-color: rgb(255, 236, 214);
            border: 3px dashed rgb(26, 255, 26);

            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            gap: 5px;
        }

        div.item {
            border: 3px dashed rgb(32, 73, 255);
            background-color: rgb(189, 255, 255);
            padding: auto;

            text-align: center;
        }

        div#A{
            /*
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: -1;
            
            grid-row: 1 / span 1;
            grid-column: 1 / -1;
            */


            grid-area: 1 / 1 / 2 / -1;
        }

        div#B{
            /*
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
            
            grid-row: 2 / span 2;
            grid-column: 1 / span 2;
            */


            grid-area: 2 / 1 / span 2 / span 2;
        }

        div#C{
            /*
            grid-row-start: 2;
            grid-row-end: -1;
            grid-column-start: 3;
            grid-column-end: 5;
            
            grid-row: 2 / span 2;
            grid-column: 3 / span 2;
            */


            grid-area: 2 / 3 / span 2 / span 2;
        }
        
    
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="A">A</div>
        <div class="item" id="B">B</div>
        <div class="item" id="C">C</div>
    </div>
</body>
</html>
