<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        * {
            font-family: monospace;
            font-size: 1.1em;
        }

        div.conteiner {
            background-color: antiquewhite;

            display: flex;
            flex-flow: row nowrap;
            align-items: center;
        }

        div.item {
            background-color: lightblue;
            border: 3px dashed black;
            border-radius: 10px;
            text-align: center;
            padding: 10px;

            flex: none;

            /*
            flex: grow shrink basis;
            
            Padrão:
            flex: 0 1 auto;


            flex: initial;
                flex: 0 1 auto

            flex: none;
                flex: 0 0 auto

            flex: auto;
                flex: 1 1 auto;

            flex: 3;
                flex: 3 1 auto;


            */

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">AA</div>
        <div class="item">BBB</div>
        <div class="item">CCCCCC</div>
        <div class="item">DDD</div>
        <div class="item">E</div>
        <div class="item">FFFF</div>
        <div class="item">GG</div>
    </div>
</body>
</html>
