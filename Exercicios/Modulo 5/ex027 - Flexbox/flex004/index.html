<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;

            font-family: monospace;
            font-size: 1.2em;
        }

        body {
            background-color: black;
        }

        main {
            background-color: antiquewhite;
            margin: auto;
            height: 90vh;
            width: 90vw;

            /*
            Centralizando Objetos
            */
            
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            
        }

        section {
            background-color: lightblue;;
            border: 3px solid black;
            border-radius: 20px;
            text-align: center;
            padding: 30px 10px;
            height: 100px;
            width: 100px;

        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>A</h1>
        </section>
    </main>
</body>
</html>
