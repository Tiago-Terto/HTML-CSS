<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: antiquewhite;
            height: 90vh;

            display: flex;
            flex-flow: row wrap;
            
            justify-content: space-between;
            align-items: center;
            
            /*
            -- Alinhamento no main-axis --
            justify-content: flex-start; - main-start
            justify-content: flex-end; - main-end
            justify-content: flex-center; - centro

            justify-content: space-between; - Espaço distribuido por igual, com itens grudados no começo e no final.
            justify-content: space-evenly; - Espaço distribuido por igual, com itens não grudados no começo e no final.

            justify-content: space-around; - Cria blocos virtuais e centraliza nos blocos virtuais


            -- Alinhamento no cross-axis --
            aling-items: stretch; - Esticar
            aling-items: flex-start; - Alinhar no cross-start
            aling-items: flex-end; - Alinhas no cross-end
            aling-items: flex-center; - Alinhar no centro

            */
        }

        div.item {
            background-color: lightblue;;
            border: 1px solid black;
            text-align: center;
            padding: 50px;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
